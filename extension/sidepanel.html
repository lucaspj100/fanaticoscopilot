<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>United Copilot</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <span class="dot" id="dot"></span>
        <strong>UNITED COPILOT</strong>
      </div>
      <button id="toggle">Iniciar</button>
    </header>

    <p class="status" id="status">Abra a call em app.zoom.us, volte para esta aba e clique em Iniciar.</p>

    <main id="cards"></main>

    <button id="diag-toggle" class="ghost">Ver diagnóstico</button>

    <div id="diag-panel" hidden>
      <section class="diag">
        <h2>Latência <span id="diag-total"></span></h2>
        <ul id="diag"></ul>
        <div class="diag-key">
          <span>1º alerta <b id="diag-first">—</b></span>
          <span>Sugestão completa <b id="diag-full">—</b></span>
        </div>
      </section>

      <section class="diag">
        <h2>Rede</h2>
        <ul id="net"><li>Nenhuma requisição ainda<b>—</b></li></ul>
      </section>

      <section class="transcript">
        <h2>Transcrição</h2>
        <ul id="transcript"></ul>
      </section>

      <footer>
        <label for="endpoint">Servidor</label>
        <input id="endpoint" type="url" spellcheck="false" />
      </footer>
    </div>

    <script src="sidepanel.js"></script>
  </body>
</html>
